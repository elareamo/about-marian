<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Would You Like To Know Me?</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Georgia, serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(#F8F3ED,#F3E7DA);
overflow:hidden;
}

.container{
text-align:center;
max-width:650px;
padding:40px;
animation:fade 1.5s;
}

.question{
font-size:55px;
margin-bottom:15px;
}

h1{
font-size:42px;
color:#5C4438;
margin-bottom:18px;
}

p{
color:#7A6658;
font-size:18px;
line-height:1.8;
margin-bottom:40px;
}

.buttons{
display:flex;
justify-content:center;
gap:18px;
flex-wrap:wrap;
}

.btn{
text-decoration:none;
padding:15px 34px;
border-radius:50px;
font-weight:bold;
transition:.3s;
font-size:16px;
}

.yes{
background:#C89F7A;
color:white;
box-shadow:0 8px 18px rgba(200,159,122,.35);
}

.no{
border:2px solid #C89F7A;
color:#8B6A55;
background:white;
}

.btn:hover{
transform:translateY(-3px);
}

footer{
position:absolute;
bottom:20px;
width:100%;
text-align:center;
color:#B29582;
font-size:13px;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.petal{
position:absolute;
font-size:18px;
opacity:.25;
animation:float 12s linear infinite;
}

.p1{left:8%; top:-10%; animation-delay:0s;}
.p2{left:28%; top:-15%; animation-delay:3s;}
.p3{left:70%; top:-12%; animation-delay:6s;}
.p4{left:88%; top:-18%; animation-delay:9s;}

@keyframes float{
to{
transform:translateY(120vh) rotate(360deg);
}
}

</style>
</head>

<body>

<div class="petal p1">🌸</div>
<div class="petal p2">🤍</div>
<div class="petal p3">🌷</div>
<div class="petal p4">🌸</div>

<div class="container">

<div class="question">?</div>

<h1>Would you like to know this person?</h1>

<p>
A tiny story about someone who's still becoming
the person she dreams of being.
</p>

<div class="buttons">

<a href="intro.html" class="btn yes">
Yes ♡
</a>

<a href="sad.html" class="btn no">
No
</a>

</div>

</div>

<footer>
Made by Marian Faith G. Fernandez
</footer>

</body>
</html>
